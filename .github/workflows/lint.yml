name: lint

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
      -
        name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          only-new-issues: true
